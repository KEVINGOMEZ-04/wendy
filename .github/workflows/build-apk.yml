name: Build ATRIA APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Local Web Assets & App Icon
        run: |
          mkdir -p www
          cp -r index.html manifest.json css js data assets www/ || true
          cp sw.js www/ || true

      - name: Install Dependencies & Initialize Capacitor
        run: |
          npm install
          npx cap add android || true
          npx cap sync android

      - name: Inject Android Permissions & Native Features
        run: |
          node -e '
            const fs = require("fs");
            
            // 1. Inyectar permisos en AndroidManifest.xml
            const manifestPath = "android/app/src/main/AndroidManifest.xml";
            if (fs.existsSync(manifestPath)) {
              let manifest = fs.readFileSync(manifestPath, "utf8");
              const permissions = `
    <!-- PERMISOS NATIVOS PARA ATRIA -->
    <uses-permission android:name="android.permission.INTERNET" />
    <uses-permission android:name="android.permission.RECORD_AUDIO" />
    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
    <uses-permission android:name="android.permission.VIBRATE" />
    <uses-permission android:name="android.permission.WAKE_LOCK" />
    <uses-permission android:name="android.permission.CAMERA" />
    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              `;
              
              if (!manifest.includes("android.permission.RECORD_AUDIO")) {
                manifest = manifest.replace("<manifest", "<manifest\n" + permissions);
              }
              
              // Habilitar hardware acceleration y cleartext/mixed content
              manifest = manifest.replace("<application", "<application android:usesCleartextTraffic=\"true\" android:hardwareAccelerated=\"true\"");
              fs.writeFileSync(manifestPath, manifest);
              console.log("AndroidManifest.xml actualizado con todos los permisos.");
            }

            // 2. Personalizar MainActivity.java para solicitar permisos y habilitar WebRTC / getUserMedia
            const mainActivityPath = "android/app/src/main/java/com/kevinwendy/atria/MainActivity.java";
            if (fs.existsSync(mainActivityPath)) {
              const javaContent = `package com.kevinwendy.atria;

import android.Manifest;
import android.content.pm.PackageManager;
import android.os.Build;
import android.os.Bundle;
import android.webkit.PermissionRequest;
import android.webkit.WebChromeClient;
import android.webkit.WebSettings;
import android.webkit.WebView;
import androidx.core.app.ActivityCompat;
import androidx.core.content.ContextCompat;
import com.getcapacitor.BridgeActivity;
import java.util.ArrayList;
import java.util.List;

public class MainActivity extends BridgeActivity {
    private static final int PERMISSION_REQUEST_CODE = 101;

    @Override
    public void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);
        requestAppPermissions();
        configureWebViewSettings();
    }

    private void requestAppPermissions() {
        List<String> listPermissionsNeeded = new ArrayList<>();

        if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
            listPermissionsNeeded.add(Manifest.permission.RECORD_AUDIO);
        }
        if (ContextCompat.checkSelfPermission(this, Manifest.permission.MODIFY_AUDIO_SETTINGS) != PackageManager.PERMISSION_GRANTED) {
            listPermissionsNeeded.add(Manifest.permission.MODIFY_AUDIO_SETTINGS);
        }
        if (ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) {
            listPermissionsNeeded.add(Manifest.permission.CAMERA);
        }

        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
            if (ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                listPermissionsNeeded.add(Manifest.permission.POST_NOTIFICATIONS);
            }
            if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_MEDIA_IMAGES) != PackageManager.PERMISSION_GRANTED) {
                listPermissionsNeeded.add(Manifest.permission.READ_MEDIA_IMAGES);
            }
            if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_MEDIA_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                listPermissionsNeeded.add(Manifest.permission.READ_MEDIA_AUDIO);
            }
        } else {
            if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_EXTERNAL_STORAGE) != PackageManager.PERMISSION_GRANTED) {
                listPermissionsNeeded.add(Manifest.permission.READ_EXTERNAL_STORAGE);
            }
            if (ContextCompat.checkSelfPermission(this, Manifest.permission.WRITE_EXTERNAL_STORAGE) != PackageManager.PERMISSION_GRANTED) {
                listPermissionsNeeded.add(Manifest.permission.WRITE_EXTERNAL_STORAGE);
            }
        }

        if (!listPermissionsNeeded.isEmpty()) {
            ActivityCompat.requestPermissions(this, listPermissionsNeeded.toArray(new String[0]), PERMISSION_REQUEST_CODE);
        }
    }

    private void configureWebViewSettings() {
        try {
            WebView webView = getBridge().getWebView();
            if (webView != null) {
                WebSettings settings = webView.getSettings();
                settings.setJavaScriptEnabled(true);
                settings.setDomStorageEnabled(true);
                settings.setDatabaseEnabled(true);
                settings.setAllowFileAccess(true);
                settings.setAllowContentAccess(true);
                settings.setMediaPlaybackRequiresUserGesture(false);
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                    settings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                }

                webView.setWebChromeClient(new WebChromeClient() {
                    @Override
                    public void onPermissionRequest(final PermissionRequest request) {
                        runOnUiThread(new Runnable() {
                            @Override
                            public void run() {
                                request.grant(request.getResources());
                            }
                        });
                    }
                });
            }
        } catch (Exception e) {
            e.printStackTrace();
        }
    }
}
`;
              fs.writeFileSync(mainActivityPath, javaContent);
              console.log("MainActivity.java actualizado con solicitador de permisos y WebChromeClient.");
            }
          '

      - name: Generate App Icons from Official Logo
        run: |
          npm install -g @capacitor/assets
          if [ -f assets/icon.jpg ]; then
            mkdir -p resources
            cp assets/icon.jpg resources/icon.jpg
            cp assets/icon.jpg resources/splash.jpg
            find android/app/src/main/res -name "ic_launcher*.png" -exec cp assets/icon.jpg {} \; || true
          fi

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename & Prepare APK Output
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/ATRIA.apk

      - name: Upload APK to Google Drive
        run: |
          node -e '
            const fs = require("fs");
            const https = require("https");
            
            const apkPath = "build-output/ATRIA.apk";
            if (fs.existsSync(apkPath)) {
              const apkBuffer = fs.readFileSync(apkPath);
              const b64 = apkBuffer.toString("base64");
              const scriptUrl = "https://script.google.com/macros/s/AKfycbwlvCsQoPOFWsE1JEirVv16Fy2IFwzsOAUxwJtFn-QRg9u4HWpv8JowqniTGZ72OY4o/exec";
              
              const payload = JSON.stringify({
                action: "createFolderAndUpload",
                parentFolderId: "1qXPifAHV5fTVX7HdI1ab6UzAjDTpiwjm",
                folderName: "App ATRIA Oficial (APK)",
                files: [
                  {
                    name: "ATRIA",
                    data: "data:application/vnd.android.package-archive;base64," + b64
                  }
                ]
              });
              
              console.log("Enviando APK a Google Drive...");
              const req = https.request(scriptUrl, {
                method: "POST",
                headers: { "Content-Type": "text/plain" }
              }, (res) => {
                let data = "";
                res.on("data", chunk => data += chunk);
                res.on("end", () => console.log("Google Drive Response:", data));
              });
              req.on("error", e => console.warn("Notice on Drive upload:", e.message));
              req.write(payload);
              req.end();
            }
          ' || true

      - name: Upload APK Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: ATRIA-APK
          path: build-output/ATRIA.apk

      - name: Publish Release with ATRIA.apk
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "ATRIA v1.0.0 (APK Oficial con Permisos Nativos)"
          body: |
            # ATRIA - La puerta de entrada a nuestro mundo compartido
            
            Aplicacion movil nativa oficial de **Kevin & Wendy**.
            
            ### Permisos integrados:
            - Microfono nativo para notas de voz en recuerdos, muro y capsulas del tiempo.
            - Notificaciones en la barra superior de Android (estilo WhatsApp / YouTube).
            - Acceso a almacenamiento y camara para subir fotos y videos.
            
            ### Instalacion directa en Android:
            1. Descarga el archivo **`ATRIA.apk`** adjunto aqui abajo en tu celular.
            2. Abre el archivo descargado para instalarlo.
            3. Si tu celular te solicita permiso de *"Instalar aplicaciones desconocidas"*, dale en **Permitir**.
            4. Al abrir la app, acepta los permisos de microfono y notificaciones.
            5. Abre **ATRIA** con su icono oficial y pantalla completa.
          files: build-output/ATRIA.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}