name: Build ATRIA APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Local Web Assets
        run: |
          mkdir -p www
          cp -r index.html manifest.json css js data www/ || true
          cp sw.js www/ || true

      - name: Install Dependencies & Initialize Capacitor
        run: |
          npm install
          npx cap add android || true
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename & Prepare APK Output
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/ATRIA.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ATRIA-APK
          path: build-output/ATRIA.apk

      - name: Publish Release with ATRIA.apk
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "ATRIA v1.0.0 🏛️✨ (APK Oficial)"
          body: |
            # 🏛️ ATRIA — La puerta de entrada a nuestro mundo compartido
            
            Aplicación móvil nativa oficial de **Kevin & Wendy**.
            
            ### 📱 Instalación directa en Android:
            1. Descarga el archivo **`ATRIA.apk`** adjunto aquí abajo en tu celular.
            2. Abre el archivo descargado para instalarlo.
            3. Si tu celular te solicita permiso de *"Instalar aplicaciones desconocidas"*, dale en **Permitir**.
            4. ¡Listo! Abre **ATRIA** con su icono y pantalla completa.
          files: build-output/ATRIA.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}